[project]
name = "taller"
authors = [{ name = "Ariel Peña", email = "ariel@example.com" }]
description = "Taller mecánico, hojalatería y pintura para Frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
